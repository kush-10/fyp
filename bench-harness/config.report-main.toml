[defaults]
trials = 5
timeout_sec = 1800
output_root = "artifacts/benchmarks/report-benchmarks/main"

[[targets]]
id = "aes-r0"
enabled = true
workdir = "aes-r0"
command = ["cargo", "run", "-p", "host", "--release", "--", "--json"]

[[targets]]
id = "lowmc-r0-optimised"
enabled = true
workdir = "lowmc-r0-optimised"
command = ["cargo", "run", "-p", "host", "--release", "--", "--json"]

